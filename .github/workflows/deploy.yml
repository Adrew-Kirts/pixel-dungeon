name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options:
          - deploy
          - rollback-site
          - rollback-api
        default: deploy

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://strikwerda.fr
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy API
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: scripts/deploy-api.sh
      - name: Deploy site
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: scripts/deploy.sh
      - name: Roll back site
        if: inputs.action == 'rollback-site'
        run: scripts/rollback.sh site
      - name: Roll back API
        if: inputs.action == 'rollback-api'
        run: scripts/rollback.sh api
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://strikwerda.fr/
          BOARD="$(curl -fsS 'https://strikwerda.fr/api/leaderboard?mode=deep')"
          grep -q '"entries"' <<< "$BOARD"
